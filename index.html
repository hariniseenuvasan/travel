<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>

        body{
            background-image: url(travel.jpg);
            background-size: cover;
            background-repeat: no-repeat;
        }
        @media (min-width: 601px) and (max-width: 992px) {

            header {
                flex-wrap: wrap;
                gap: 15px;
            }

            .card {
                width: 80% ;
                max-width: 450px;
            }

            footer {
                font-size: large ;
            }
        }

        @media (max-width: 600px) {

            header {
                flex-direction: column;
                gap: 15px;
                text-align: center;
            }

            header h1 {
                font-size: 25px;
            }

            nav {
                flex-wrap: wrap;
                justify-content: center;
            }

            .card {
                width: 100% ;
                max-width: 100%;
            }

            .card h1 {
                font-size: 25px;
            }

            .card button {
                margin-top: 10px;
            }

            footer {
                font-size: medium;
            }
        }

    </style>
</head>

<body>
<header class="a6 p-4 d-flex justify-content-between align-items-center">
    <h1 class="left mb-0"> &#128205; Explore World</h1>
    <nav class="d-flex gap-3">
        <a href="Home" class="a btn btn-success">Home </a>
        <a href="Contact" class="a1 btn btn-warning">Contact </a>
        <a href="About" class="a2 btn btn-danger">About </a>
    </nav>
</header>

<div class="container d-flex justify-content-center">
    <div class="card a4 mt-5 mb-5 p-3" style="width:450px; height:auto;max-width: 500px; ">
        <div class="card-body p-2">
            <h1 class="text-center mb-3">
                Find the Best Places
            </h1>
            <label class="a5" for="destination">Destination</label>
            <input type="text" name="destination" id="destination" class="form-control mb-3">
        </div>

        <div class="text-center">
            <button class="btn btn-primary mt-5">Holidays</button>
            <button class="btn btn-primary mt-5">Flights</button>
            <button class="btn btn-primary mt-5">Hotels</button>
            <br><br>
            <label style="font-size: x-large;" for="Date">Date</label>
            <input type="date" name="Date" id="Date" class="form-control mb-3">
            <br>
            <label style="font-size: x-large;" for="Destination">Select People</label>
            <select class="form-control mb-3">
                <option>people1</option>
                <option>people2</option>
                <option>people3</option>
                <option>people4</option>
                <option>people5</option>
            </select>
        </div>

        <button style=" border-radius: 50px; color: aliceblue;" class="bg-dark">Explore</button>
    </div>
</div>

<footer class="container-fluid text-center " style="font-size: xx-large;">&copy; 2026 Explore World. All Rights Reserved</footer>

</body>
</html>
